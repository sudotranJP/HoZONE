<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HoZONE - 食材登録・編集</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="header-top">
      <h1 id="register-heading">食材登録</h1>
      <span class="gear">⚙️</span>
    </div>
  </header>

  <main>
    <form id="food-form">
      <label for="food-name">名前※</label>
      <input type="text" id="food-name" required>

      <label for="expiry-date">消費(賞味)期限※</label>
      <input type="date" id="expiry-date" required>

      <label for="purchase-date">購入日※</label>
      <input type="date" id="purchase-date" required>

      <label>保存場所※</label>
      <div class="location-buttons" id="location-buttons">
        <button type="button" class="location-btn" data-value="常温">常温</button>
        <button type="button" class="location-btn" data-value="冷蔵">冷蔵庫</button>
        <button type="button" class="location-btn" data-value="冷凍">冷凍</button>
      </div>

      <div id="frozen-food-field" class="frozen-food-check" hidden>
        <input type="checkbox" id="is-frozen-food">
        <label for="is-frozen-food" style="margin:0;">これは冷凍食品です（冷凍焼け通知の対象外にします）</label>
      </div>

      <div id="frozen-date-field" hidden>
        <label for="frozen-date">冷凍開始日（冷凍庫に入れた日）</label>
        <input type="date" id="frozen-date">
      </div>

      <p class="required-note">※は必須項目です。</p>

      <button type="submit" id="submit-btn">登録する</button>
    </form>
    <a href="index.html" class="back-link">← ホームに戻る</a>
  </main>

  <script src="js/common.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
